<title>Knjiga reševalnih prevozov</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: control room. A floating left rail (Knjiga, Dispečer, Posebnosti, Nastavitve) beside one wide work surface; a bottom tab bar on phones.
   Colour: cool blue-grey paper, navy ink, one signal orange for primary actions and "danes"; green/amber/red are reserved for state.
   Type: Bricolage Grotesque for headings and date numerals, IBM Plex Sans for the interface, IBM Plex Mono for times, kilometres and ride numbers. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --surface-3:#E7EBF2;
  --ink:#0D1A2C; --ink-2:#47566E; --ink-3:#74839B; --line:#D6DCE7; --line-2:#C5CDDB;
  --accent:#DD5207; --accent-ink:#FFFFFF; --accent-soft:#FCE6D9; --accent-line:#F1B896;
  --ok:#17794F; --ok-soft:#DCF2E7; --warn:#8A5B00; --warn-soft:#FFEFC2; --bad:#B7222A; --bad-soft:#FADFE0;
  --info:#2250B8; --info-soft:#E0E9FC;
  --m-sede:#2250B8; --m-leze:#7B3BBF; --m-utila:#0A7581;
  --rail:#0D1A2C; --rail-ink:#DCE4F2; --rail-dim:#8C9BB5; --rail-line:#22324B;
  --pc0:#2F5FD0; --pc1:#7C4DC4; --pc2:#0E8A84; --pc3:#CC3F78; --pc4:#5F8A12; --pc5:#1B83B8; --pc6:#A8582F; --pc7:#8E3B9E;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,26,44,.06),0 6px 20px rgba(13,26,44,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111E; --surface:#111B2D; --surface-2:#16223A; --surface-3:#1D2B47;
    --ink:#E8EDF6; --ink-2:#A3B1C9; --ink-3:#7585A1; --line:#25344F; --line-2:#33456A;
    --accent:#FF8240; --accent-ink:#1A0D03; --accent-soft:#3A2314; --accent-line:#7A4524;
    --ok:#4CC790; --ok-soft:#12352A; --warn:#F0BE56; --warn-soft:#3A2D0E; --bad:#FF7F86; --bad-soft:#3E1A1E;
    --info:#7FA4FF; --info-soft:#17284F;
    --m-sede:#7FA4FF; --m-leze:#C09BFF; --m-utila:#52D0DB;
    --rail:#070C16; --rail-ink:#DCE4F2; --rail-dim:#7585A1; --rail-line:#1B2740;
    --pc0:#7FA4FF; --pc1:#B79CFF; --pc2:#4FD0C8; --pc3:#FF8DB3; --pc4:#A5CF4F; --pc5:#5DBDF0; --pc6:#E69A6E; --pc7:#D693E6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111B2D; --surface-2:#16223A; --surface-3:#1D2B47;
  --ink:#E8EDF6; --ink-2:#A3B1C9; --ink-3:#7585A1; --line:#25344F; --line-2:#33456A;
  --accent:#FF8240; --accent-ink:#1A0D03; --accent-soft:#3A2314; --accent-line:#7A4524;
  --ok:#4CC790; --ok-soft:#12352A; --warn:#F0BE56; --warn-soft:#3A2D0E; --bad:#FF7F86; --bad-soft:#3E1A1E;
  --info:#7FA4FF; --info-soft:#17284F;
  --m-sede:#7FA4FF; --m-leze:#C09BFF; --m-utila:#52D0DB;
  --rail:#070C16; --rail-ink:#DCE4F2; --rail-dim:#7585A1; --rail-line:#1B2740;
  --pc0:#7FA4FF; --pc1:#B79CFF; --pc2:#4FD0C8; --pc3:#FF8DB3; --pc4:#A5CF4F; --pc5:#5DBDF0; --pc6:#E69A6E; --pc7:#D693E6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);margin:0}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
.mono,.tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}
.rail{position:sticky;top:16px;background:var(--rail);color:var(--rail-ink);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;gap:18px;min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px var(--font-display);letter-spacing:-.02em;flex:none}
.brand b{display:block;font:700 15px/1.15 var(--font-display)}
.brand span{display:block;font-size:11.5px;color:var(--rail-dim);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--rail-dim);padding:10px 12px;border-radius:10px;text-align:left;font-weight:500}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--rail-line);color:var(--rail-ink)}
.nav button[aria-current="page"]{background:var(--rail-line);color:#fff}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font:500 11px var(--font-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rail-line);padding-top:14px}
.userbox{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--rail-line);display:grid;place-items:center;font:600 12px var(--font-body);color:var(--rail-ink);flex:none}
.userbox div{min-width:0;line-height:1.25} .userbox b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .userbox span{font-size:11.5px;color:var(--rail-dim)}
.rail-btns{display:flex;gap:6px}
.rail-btns button{flex:1;border:1px solid var(--rail-line);background:transparent;color:var(--rail-ink);border-radius:9px;padding:7px 8px;font-size:12.5px}
.rail-btns button:hover{background:var(--rail-line)}
.work{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,3.2vw,34px);font-weight:800;line-height:1.05}
.top .sub{color:var(--ink-2);margin-top:4px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.savepill{font:500 12px var(--font-mono);color:var(--ink-3);display:flex;align-items:center;gap:6px}
.savepill i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savepill.busy i{background:var(--warn)}
.tabbar{display:none}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--ink-3);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=search],input[type=time],input[type=tel],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{
  width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);transition:border-color .12s,background .12s}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
input.warnfield{border-color:var(--warn);background:var(--warn-soft)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(13,26,44,.15)}
.seg button[aria-pressed="true"][data-mode="sede"]{color:var(--m-sede)}
.seg button[aria-pressed="true"][data-mode="leze"]{color:var(--m-leze)}
.seg button[aria-pressed="true"][data-mode="utila"]{color:var(--m-utila)}
.seg.inline{display:inline-flex}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--surface-3);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.mono{font-family:var(--font-mono);font-size:11.5px}
.chip.toggle{cursor:pointer;background:var(--surface);border-color:var(--line-2);padding:5px 11px;font-size:13px}
.chip.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card h3{font-size:16px;font-weight:700}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;background:var(--info-soft);color:var(--info);font-size:13px;line-height:1.4}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner b{font-weight:600}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--ink-3)}
.empty-state{border:1.5px dashed var(--line-2);border-radius:14px;padding:26px;text-align:center;color:var(--ink-2)}

/* ---------- Auth ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.auth-art{background:var(--rail);color:var(--rail-ink);padding:clamp(28px,5vw,64px);padding-left:max(clamp(28px,5vw,64px),env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.auth-art h1{font-size:clamp(34px,5vw,60px);font-weight:800;line-height:.98;max-width:11ch}
.auth-art p{color:var(--rail-dim);max-width:44ch;margin:14px 0 0}
.auth-art svg.route{position:absolute;right:clamp(16px,4vw,48px);top:clamp(110px,18vh,190px);width:min(520px,86%);opacity:.95;pointer-events:none}
.auth-art .brand{padding:0}
.auth-art .logobar{align-self:flex-start}
.auth-form{display:flex;align-items:center;justify-content:center;padding:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.auth-card h2{font-size:26px;font-weight:800}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-err{color:var(--bad);font-size:13px;min-height:18px}
.legalnote{font-size:12px;color:var(--ink-3);line-height:1.45}

/* ---------- Month book ---------- */
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthbar h2{font-size:22px;font-weight:800;min-width:9ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:112px}
.stat b{display:block;font:600 20px var(--font-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.wk .day-head{background:var(--surface-2)}
.day.past{opacity:.82}
.day-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.day-head:hover{background:var(--surface-2)}
.dnum{font:800 34px/1 var(--font-display);letter-spacing:-.03em;min-width:1.7ch}
.today .dnum{color:var(--accent)}
.dtxt{min-width:0;flex:1}
.dname{display:block;font-weight:600;text-transform:capitalize}
.dmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.dcount{font:500 12px var(--font-mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.dcount b{display:block;font-size:16px;color:var(--ink)}
.crew{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.crew h4{font:600 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.crew-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.crew-row label{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crew-row input{padding:5px 8px;font-size:13px}
.crew-row input.auto{border-style:dashed}

/* ---------- Day book ---------- */
.daybar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{width:200px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
.box.empty{background:var(--surface-2);border-style:dashed}
.box.empty .nr{background:var(--surface-3);color:var(--ink-3)}
.box.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.box.done .bgrid{opacity:.72}
.bhead{display:flex;align-items:center;gap:6px 8px;min-height:28px;flex-wrap:wrap}
.nr{font:600 13px var(--font-mono);background:var(--ink);color:var(--bg);border-radius:7px;min-width:30px;height:26px;display:grid;place-items:center;padding:0 6px}
.bhead .sp{flex:1;min-width:0}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px}
.bgrid .full{grid-column:1/-1}
.bgrid input[type=time]{font-family:var(--font-mono)}
.donerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px}
.donerow label.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.donerow .whodid{flex:1;min-width:150px;display:none}
.box.done .whodid{display:block}
.assign{white-space:nowrap;font:500 11.5px var(--font-mono);color:var(--info);background:var(--info-soft);border-radius:99px;padding:2px 9px}
.assign.late{color:var(--bad);background:var(--bad-soft)}
.warnlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.warnlist li::marker{color:var(--warn)}
details.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px}
details.warnbox summary{cursor:pointer;font-weight:600}
/* cestni podatki, predlogi, zemljevid poti, ETA */
.routebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;font-size:13px;color:var(--ink-2)}
.routebar .rt{flex:1 1 260px;min-width:0}
.sugg{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.sugg li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.sugg li .chip{flex:none;margin-top:1px}
.eta{display:inline-flex;gap:4px;align-items:center;font:500 12px var(--font-mono);color:var(--ink-2)}
.eta.bad{color:var(--bad)} .eta.ok{color:var(--ok)} .eta.warn{color:var(--warn)}
.rmap{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:6px;margin:4px 0 2px}
.rmap svg{display:block;width:100%;height:auto;max-height:340px}
.rmap .rl{fill:none;stroke:var(--info);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.rmap .rl.est{stroke:var(--ink-3);stroke-dasharray:6 5}
.rmap .rp{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.rmap .rp.do{fill:var(--accent)}
.rmap .rp.base{fill:var(--ink);stroke:var(--ink)}
.rmap text{font:600 11px var(--font-mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.rmap .rleg{font-size:12px;color:var(--ink-2);margin:4px 4px 0}

/* ---------- Suggestions ---------- */
#suggest{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;box-shadow:0 12px 32px rgba(13,26,44,.22);padding:4px;max-height:300px;overflow:auto;min-width:240px}
#suggest button{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px}
#suggest button b{font-weight:600} #suggest button span{font-size:11.5px;color:var(--ink-3)}
#suggest button[aria-selected="true"],#suggest button:hover{background:var(--accent-soft)}
#suggest mark{background:transparent;color:var(--accent);font-weight:700}

/* ---------- Dispatcher ---------- */
.dispatch{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.duty-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.duty-item .dn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.duty-item .dsel{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.duty-item select,.duty-item input{padding:5px 8px;font-size:12.5px}
.veh-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:11px}
.veh-item.off{opacity:.6;background:var(--surface-2)}
.veh-item label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.veh-item .vn{font-weight:600}
.caps{display:flex;gap:4px;flex-wrap:wrap}
